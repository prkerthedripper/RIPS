services:
  - type: web
    name: rips-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rips-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: rips-db
    plan: free
    databaseName: rips
    user: rips
